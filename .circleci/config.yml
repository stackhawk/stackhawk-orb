version: 2.1
setup: true

orbs:
  orb-tools: circleci/orb-tools@12.1.0

workflows:
  lint-pack:
    jobs:
      - orb-tools/lint:
          source_dir: ./src/
      - orb-tools/pack
      - orb-tools/review:
          orb_name: stackhawk/stackhawk
      - orb-tools/continue:
          orb_name: stackhawk
          pipeline_number: << pipeline.number >>
          vcs_type: << pipeline.project.type >>
          requires:
            - orb-tools/lint
            - orb-tools/pack
            - orb-tools/review
